spring:
  application:
    name: ledger-service

  datasource:
    # H2 in-memory keeps the service runnable with no external setup. The adapter is written
    # against standard JPA, so pointing this at PostgreSQL is a configuration change.
    url: jdbc:h2:mem:ledger;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      # Acceptable only because the database is in-memory and recreated on every start.
      # A real deployment needs versioned migrations (Flyway or Liquibase) and ddl-auto: validate,
      # so that a schema change is a reviewed artefact rather than something Hibernate infers at
      # boot. Called out as a known limitation in the README.
      ddl-auto: create-drop

    # Off deliberately. Leaving a persistence context open for the duration of a web request lets a
    # lazy association be resolved from a controller or a serialiser, which turns rendering a
    # response into database access and hides N+1 queries in the view layer.
    open-in-view: false

    properties:
      hibernate:
        jdbc:
          # Batch the two ledger inserts a transfer produces into one round trip.
          batch_size: 20
        order_inserts: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      # Surfaces circuit breaker state in /actuator/health, so an open circuit is visible to
      # operators rather than only inferable from logs.
      show-details: always
      probes:
        enabled: true
  health:
    circuitbreakers:
      enabled: true

resilience4j:
  circuitbreaker:
    configs:
      default:
        register-health-indicator: true
    instances:
      compliance:
        # Count-based rather than time-based: screening traffic is bursty, and a time window can
        # trip on a handful of failures during a quiet minute.
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10

        # Never judge the dependency on fewer than five calls. Without this, the first failed call
        # is a 100% failure rate and the circuit opens on a single blip.
        minimum-number-of-calls: 5

        failure-rate-threshold: 50

        # Long enough for a restarting dependency to come back, short enough that recovery is not
        # gated on a human noticing.
        wait-duration-in-open-state: 10s
        automatic-transition-from-open-to-half-open-enabled: true

        # On reopening, let a few calls through to test the water rather than releasing the full load
        # onto a service that may still be fragile.
        permitted-number-of-calls-in-half-open-state: 3

        # A malformed request on our side is a defect in this service, not evidence that compliance
        # is unwell. Counting it would let one of our bugs trip the circuit and stop us calling a
        # perfectly healthy dependency.
        ignore-exceptions:
          - com.natwest.ledger.infrastructure.compliance.ComplianceContractException

  retry:
    instances:
      compliance:
        # Three attempts total, not three retries. Screening is idempotent - it reads rules and
        # returns a decision, changing nothing - so repeating it is safe.
        max-attempts: 3
        wait-duration: 200ms

        # Backoff so that a dependency struggling under load is not hit by synchronised retries from
        # every caller at the same instant.
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2

        # Retrying a 400 just produces another 400.
        ignore-exceptions:
          - com.natwest.ledger.infrastructure.compliance.ComplianceContractException

ledger:
  # The single currency this service operates in. Every account balance and every requested
  # amount must match it; the service performs no FX conversion (see Money).
  base-currency: GBP

  compliance:
    base-url: http://localhost:8081
    # Neither may be unlimited: a hung dependency exhausts the request threads and is never recorded
    # as a failure, so the circuit breaker would never trip. See ComplianceClientProperties.
    connect-timeout: 500ms
    read-timeout: 2s
