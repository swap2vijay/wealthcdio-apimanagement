spring:
  application:
    name: compliance-service

  lifecycle:
    # Kept under the chart's terminationGracePeriodSeconds so draining completes
    # before the pod is killed.
    timeout-per-shutdown-phase: 25s

server:
  # A different port from the ledger service so both can run locally at once.
  port: 8081

  # Let an in-flight screening finish rather than failing it on shutdown. A
  # refused screening would make the caller reverse a transfer unnecessarily.
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

compliance:
  # The largest transfer that may proceed. Inclusive: a transfer at exactly this value is refused,
  # because a limit in banking is a ceiling that must not be reached.
  single-transfer-limit: 10000.00

  # Counterparties this bank will not transact with, in either direction. Configuration rather than
  # code, because such lists change for regulatory reasons on their own timescale.
  blocked-accounts:
    - ACC-BLOCKED
