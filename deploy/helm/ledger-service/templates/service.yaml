# ClusterIP: reachable from inside the cluster, and nowhere else.
#
# Not a LoadBalancer and not fronted by an Ingress in this chart, because none of
# the endpoints authenticate their caller yet. Publishing an unauthenticated API
# that moves money would be the single worst decision in this repository, so the
# chart does not offer a switch for it. Add authentication, then add an Ingress.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ledger-service.fullname" . }}
  labels:
    {{- include "ledger-service.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      # Named, because probes and any future NetworkPolicy or ServiceMonitor can
      # then refer to "http" instead of repeating the number and drifting from it.
      targetPort: http
      protocol: TCP
      name: http
  selector:
    # The stable two-label subset. See _helpers.tpl for why the version label is
    # deliberately absent.
    {{- include "ledger-service.selectorLabels" . | nindent 4 }}
