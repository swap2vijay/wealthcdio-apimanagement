{{- if .Values.serviceAccount.create -}}
# A dedicated service account rather than the namespace default.
#
# The default account is shared by everything in the namespace, so any RBAC
# granted to it is granted to all of them. Giving this service its own identity
# costs nothing and means future permissions can be scoped to it alone.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ledger-service.serviceAccountName" . }}
  labels:
    {{- include "ledger-service.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The service never calls the Kubernetes API, so it is not given a token that
# would let it. If the pod is ever compromised, there is no cluster credential
# sitting on the filesystem to steal.
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
