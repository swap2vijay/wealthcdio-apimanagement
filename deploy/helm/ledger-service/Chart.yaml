apiVersion: v2
name: ledger-service
description: |
  Banking transaction processor - accounts, ledger and transaction APIs.

  Its own chart rather than a subchart of a platform release, because the ledger
  and compliance services are independently deployable. Bundling them would mean
  every change to one triggered a release of the other, which is precisely the
  coupling that keeping them separate is meant to avoid.
type: application

# The chart's own version. Bumped when the templates change.
version: 0.1.0

# The application version this chart defaults to deploying. Overridden per
# deployment with --set image.tag=<commit>, so this is only the fallback.
appVersion: "0.1.0"

keywords:
  - banking
  - ledger
  - payments

maintainers:
  - name: WealthCDIO API Management
