# =============================================================================
# ledger-service - default values
#
# Never executed: there was no cluster available while writing this. Reviewed,
# but treat it as a starting point rather than something proven to deploy.
# =============================================================================

# -----------------------------------------------------------------------------
# Replicas
# -----------------------------------------------------------------------------
#
# ONE, and this is a correctness constraint rather than a capacity choice.
#
# The service currently runs H2 in memory (see the README's limitations section).
# Every pod therefore has its OWN database: a second replica would not share the
# ledger, it would invent a parallel one. Two customers hitting different pods
# would see different balances, and a transfer could be screened against a state
# no other pod agrees with.
#
# Raising this is safe ONLY after pointing spring.datasource at a shared external
# database. The optimistic locking from Phase 4 already makes concurrent access
# across replicas correct once they share one; nothing in the application code
# needs to change.
replicaCount: 1

image:
  repository: registry.example.internal/wealthcdio/ledger-service
  # Overridden by the pipeline with the commit sha. Deliberately not "latest":
  # a moving tag makes "what is deployed?" unanswerable and a rollback a guess.
  tag: "0.1.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []

# -----------------------------------------------------------------------------
# Rollout strategy
# -----------------------------------------------------------------------------
#
# Recreate: the old pod is stopped before the new one starts, which means a short
# gap with no service at all.
#
# That looks like the wrong choice for a payment API, and it would be - except
# that a rolling update would briefly run two pods, and with an in-memory
# database those two pods hold DIFFERENT ledgers. Requests would be balanced
# across both, so two consecutive balance queries could disagree and a transfer
# could be debited from a ledger that is about to be discarded. A few seconds of
# honest downtime is better than a few seconds of contradictory answers.
#
# Switch this to RollingUpdate at the same time as moving to a shared database
# and raising replicaCount. The two changes belong together.
strategy:
  type: Recreate

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  # No API access is needed, so no token is mounted. A service that does not talk
  # to the Kubernetes API should not carry a credential that lets it.
  automountServiceAccountToken: false
  annotations: {}

# -----------------------------------------------------------------------------
# Service
# -----------------------------------------------------------------------------
service:
  type: ClusterIP
  port: 8080
  # No Ingress here on purpose. There is no authentication on any endpoint yet
  # (see the README), so exposing this outside the cluster would publish an
  # unauthenticated money-moving API. Add auth first, then an Ingress.

# -----------------------------------------------------------------------------
# Resources
# -----------------------------------------------------------------------------
#
# The memory limit is what the JVM sizes its heap against: the image sets
# MaxRAMPercentage=75, so a 768Mi limit yields roughly a 576Mi heap and leaves
# the rest for metaspace, thread stacks and the JVM itself. Changing the limit
# resizes the heap automatically; that is the point of not setting -Xmx.
#
# Request equals limit for memory, which puts the pod in the Guaranteed QoS class
# so it is not evicted under node pressure. A payment service being evicted
# mid-saga is how money gets stranded.
#
# CPU has a request but no limit. A CPU limit throttles the JVM, and throttling
# during garbage collection or JIT warm-up produces latency spikes that look like
# application faults. The request guarantees a share; a limit would only cap it.
resources:
  requests:
    cpu: 500m
    memory: 768Mi
  limits:
    memory: 768Mi

# -----------------------------------------------------------------------------
# Probes
# -----------------------------------------------------------------------------
#
# Spring Boot's dedicated probe groups, not a single /actuator/health for both.
# The distinction matters: liveness answers "should this pod be restarted?" and
# readiness answers "should it receive traffic?". Pointing liveness at the full
# health endpoint would restart a perfectly good pod because a downstream
# dependency was unwell - turning someone else's outage into your own.
probes:
  startup:
    # A JVM takes seconds to start, and a liveness probe that begins immediately
    # will kill it before it ever finishes. The startup probe holds the others off
    # and allows up to 30 x 2s = 60s, generous enough for a slow node.
    path: /actuator/health/readiness
    periodSeconds: 2
    failureThreshold: 30
  liveness:
    path: /actuator/health/liveness
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    path: /actuator/health/readiness
    periodSeconds: 5
    timeoutSeconds: 2
    # Comes out of the load balancer quickly when unwell, goes back in
    # cautiously.
    failureThreshold: 2
    successThreshold: 1

# -----------------------------------------------------------------------------
# Autoscaling
# -----------------------------------------------------------------------------
#
# DISABLED, for the same reason replicaCount is 1: horizontal scaling on top of
# a per-pod in-memory database would create divergent ledgers. This is left here
# configured and switched off rather than omitted, so that enabling it after the
# database move is a values change rather than a chart change.
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

# -----------------------------------------------------------------------------
# Application configuration
# -----------------------------------------------------------------------------
config:
  # Structured logs to stdout for the platform to collect.
  loggingConfig: classpath:log4j2-json.xml

  # In-cluster DNS name of the compliance service. Must match that chart's
  # fullname and port.
  complianceBaseUrl: http://compliance-service:8081
  complianceConnectTimeout: 500ms
  complianceReadTimeout: 2s

  baseCurrency: GBP

  # Extra environment variables, for anything not modelled above.
  extraEnv: {}

# -----------------------------------------------------------------------------
# Scheduling
# -----------------------------------------------------------------------------
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

# Must exceed spring.lifecycle.timeout-per-shutdown-phase (25s) or the pod is
# killed while still draining and graceful shutdown achieves nothing.
terminationGracePeriodSeconds: 30
