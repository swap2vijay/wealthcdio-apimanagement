apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "compliance-service.fullname" . }}
  labels:
    {{- include "compliance-service.labels" . | nindent 4 }}
spec:
  # Omitted when the HPA owns the number - and here it does, so this branch is the
  # inactive one. If both declared a replica count they would fight: Helm would
  # reset it on every upgrade and the autoscaler would immediately undo that.
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "compliance-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Rolls the pods when the screening rules change. Without it, adjusting the
        # transfer limit would update the ConfigMap and leave every running pod
        # applying the old limit - a configuration change that appears to have been
        # applied and has not. For a compliance control that is the worst kind of
        # silent failure.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "compliance-service.labels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "compliance-service.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}

      # Must exceed spring.lifecycle.timeout-per-shutdown-phase (25s). Cutting a
      # screening off mid-flight is not harmless: the caller treats an unanswered
      # call as unavailable and reverses a transfer that may well have been about
      # to be approved.
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}

      securityContext:
        # Verifies at the platform level what the Dockerfile promises. If someone
        # rebuilds the image without its USER instruction, the pod refuses to start
        # rather than quietly running as root.
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          ports:
            - name: http
              # 8081, matching server.port. Named so the probes and the Service
              # refer to "http" and cannot drift from the number.
              containerPort: 8081
              protocol: TCP

          envFrom:
            - configMapRef:
                name: {{ include "compliance-service.fullname" . }}

          # Startup holds the other two off while the JVM boots; liveness asks only
          # about this process; readiness governs traffic and is what drains the pod
          # on SIGTERM. Pointing liveness at a health endpoint that included
          # dependencies would turn an unrelated wobble into a restart loop - though
          # this service has no downstream dependencies at all, which is part of why
          # it is the safer of the two to scale.
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: http
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}

          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}

          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            # One second, tighter than the ledger service's two. The caller's read
            # timeout is 2s and a slow replica burns the caller's budget before
            # failing, so an unresponsive pod should leave the load balancer sooner
            # than it would elsewhere.
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
            successThreshold: {{ .Values.probes.readiness.successThreshold }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          # The one writable path a read-only root filesystem still has to provide:
          # the JVM writes hsperfdata there for jcmd and jstack, and Tomcat wants it
          # for multipart staging. Scoped to the pod's lifetime.
          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir: {}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
