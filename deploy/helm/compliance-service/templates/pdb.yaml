{{- if .Values.podDisruptionBudget.enabled -}}
# Present in this chart and absent from the ledger service's, and the difference is
# not an oversight.
#
# A PodDisruptionBudget only constrains VOLUNTARY disruption: node drains, cluster
# upgrades, anything an operator initiates. With minAvailable 1 across two replicas
# it means an upgrade evicts one pod at a time rather than both together, so
# screening stays available and the ledger service keeps accepting transfers.
#
# The same object on a single-replica Deployment would be actively harmful:
# minAvailable 1 out of 1 permits no evictions at all, so a node drain blocks
# indefinitely waiting for a budget that can never be satisfied. That is why the
# ledger chart, pinned to one replica by its in-memory database, does not have one.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "compliance-service.fullname" . }}
  labels:
    {{- include "compliance-service.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "compliance-service.selectorLabels" . | nindent 6 }}
{{- end }}
