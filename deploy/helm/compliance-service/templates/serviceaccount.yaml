{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "compliance-service.serviceAccountName" . }}
  labels:
    {{- include "compliance-service.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# No Kubernetes API access is needed, so no token is mounted. This service has an
# even weaker claim to one than the ledger service: it reads its configuration at
# startup and answers HTTP, nothing more.
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
