# Screening rules as configuration, not code.
#
# A transfer limit and a blocked-counterparty list change for regulatory reasons,
# on a timescale unrelated to software releases. Keeping them here means adjusting
# a limit is a values change and a rollout, not a code change, a review, a build
# and a release.
#
# The names below are asserted by EnvironmentVariableBindingTest in the
# compliance-service test suite. That test exists because nothing else in the
# build reads this file, and because every property here has a default - so a name
# that binds to nothing does not fail, it silently screens against the wrong limit.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "compliance-service.fullname" . }}
  labels:
    {{- include "compliance-service.labels" . | nindent 4 }}
data:
  LOGGING_CONFIG: {{ .Values.config.loggingConfig | quote }}

  # Quoted so YAML hands Spring the string "10000.00" rather than a float. A float
  # would be parsed in binary and could not represent the value exactly, which is
  # the same reason the domain uses BigDecimal throughout and never double.
  COMPLIANCE_SINGLE_TRANSFER_LIMIT: {{ .Values.config.singleTransferLimit | quote }}

  # Indexed keys, because that is how Spring binds a list from the environment.
  # Rendered from the values list so the chart's input stays a readable YAML array
  # rather than the operator having to number the entries by hand.
  {{- range $index, $account := .Values.config.blockedAccounts }}
  COMPLIANCE_BLOCKEDACCOUNTS_{{ $index }}: {{ $account | quote }}
  {{- end }}
  {{- range $key, $value := .Values.config.extraEnv }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
